<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CST Agent · 工程读回</title>
<style>
:root{color-scheme:dark;font:14px system-ui;color:#e7edf5;background:#111721}*{box-sizing:border-box}body{margin:0}header{padding:20px 24px;border-bottom:1px solid #334054;display:flex;gap:16px;align-items:center}h1{font-size:20px;margin:0}small,.muted{color:#a1b2c6}button,select{background:#223043;color:inherit;border:1px solid #445672;border-radius:6px;padding:8px}button{cursor:pointer}.status{padding:12px 24px;color:#aec3dc}main{display:grid;grid-template-columns:minmax(360px,1.5fr) minmax(300px,1fr);gap:16px;padding:0 24px 24px}section{border:1px solid #334054;border-radius:10px;overflow:hidden;background:#18212e}h2{font-size:15px;margin:0;padding:14px 16px;background:#1f2a3a}#geometry{height:440px;position:relative}#geometry canvas{display:block}#schematic,#plot{width:100%;height:320px}.wide{grid-column:1/-1}table{border-collapse:collapse;width:100%;font-size:12px}th,td{text-align:left;border-bottom:1px solid #334054;padding:8px;word-break:break-word}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;padding:0 16px}.pad{padding:12px 16px}.tools{display:flex;gap:12px;align-items:center;padding:10px 16px}svg text{fill:#dbe6f5;font:12px system-ui}@media(max-width:850px){main{grid-template-columns:1fr}.wide{grid-column:auto}header{flex-wrap:wrap}}
</style>
<script type="importmap">{"imports":{"three":"./lib/build/three.module.js","three/addons/":"./lib/examples/jsm/"}}</script>
<header><h1>CST Agent <small>工程读回</small></h1><select id="snapshots" aria-label="工程快照"></select><button id="refresh">刷新快照目录</button></header>
<div class="status" id="status">正在读取本地证据…</div>
<div id="jobs" class="pad"></div><main><section><h2>3D 模型</h2><div id="geometry"></div><div class="pad muted" id="geometry-note"></div></section>
<section><h2>参数与物理设置</h2><div id="parameters"></div><pre id="settings"></pre></section>
<section><h2>原理图 · 实际连接，派生布局</h2><svg id="schematic" viewBox="0 0 800 320"></svg><div class="pad muted">器件和 Net 来自读回。此图不是 CST 原生布局编辑器。</div></section>
<section><h2>原始结果曲线</h2><div class="tools"><select id="curves" aria-label="结果曲线"></select><select id="representation" aria-label="曲线表示"><option value="real">实部</option><option value="magnitude">幅值</option><option value="db">幅度 dB（20 log10）</option><option value="dbpower">方向性 dBi（10 log10）</option></select></div><svg id="plot" viewBox="0 0 800 320"></svg><div id="curve-meta" class="pad muted"></div></section>
<section class="wide"><h2>模型、材料与网络明细</h2><div id="objects"></div><pre id="network"></pre></section></main>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
const $=id=>document.getElementById(id), ns='http://www.w3.org/2000/svg';
const fetchJSON=async path=>{const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw Error(`${path}: ${r.status}`);return r.json()};
let generation=0,curveGeneration=0,curves=[],cleanup=()=>{};
function table(host,columns,rows){host.replaceChildren();const t=document.createElement('table');const tr=document.createElement('tr');columns.forEach(c=>{const th=document.createElement('th');th.textContent=c;tr.append(th)});t.append(tr);rows.forEach(row=>{const tr=document.createElement('tr');row.forEach(v=>{const td=document.createElement('td');td.textContent=typeof v==='object'?JSON.stringify(v):String(v??'未取得');tr.append(td)});t.append(tr)});host.append(t)}
function svg(parent,tag,attrs,text){const e=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));if(text!==undefined)e.textContent=text;parent.append(e);return e}
async function renderModel(snapshot,base,expected){
 cleanup();const host=$('geometry');host.replaceChildren();const scene=new THREE.Scene();scene.background=new THREE.Color('#101823');
 const camera=new THREE.PerspectiveCamera(45,host.clientWidth/host.clientHeight,.01,1e8);camera.up.set(0,0,1);
 const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));host.append(renderer.domElement);
 const controls=new OrbitControls(camera,renderer.domElement);const objects=new THREE.Group();scene.add(objects);scene.add(new THREE.HemisphereLight(0xffffff,0x637086,3));
 const disposable=[];let cadLoaded=false;
 for(const part of snapshot.cad?.meshes??(snapshot.cad?.file?[snapshot.cad]:[])){try{const meshGeometry=await new STLLoader().loadAsync(base+part.file);if(expected!==generation){meshGeometry.dispose();controls.dispose();renderer.dispose();return}meshGeometry.computeVertexNormals();const mat=new THREE.MeshStandardMaterial({color:0x8ba6ca,side:THREE.DoubleSide,transparent:true,opacity:.68,roughness:.6});const mesh=new THREE.Mesh(meshGeometry,mat);mesh.userData.name=part.object;objects.add(mesh);disposable.push(meshGeometry,mat);cadLoaded=true}catch(e){$('geometry-note').textContent=String(e)}}
 if(!cadLoaded){for(const s of snapshot.solids??[]){const [ok,x1,x2,y1,y2,z1,z2]=s.bounding_box??[];if(!ok)continue;const g=new THREE.BoxGeometry(x2-x1,y2-y1,z2-z1);const edges=new THREE.EdgesGeometry(g);g.dispose();const mat=new THREE.LineBasicMaterial({color:0x7a9fc9});const line=new THREE.LineSegments(edges,mat);line.position.set((x1+x2)/2,(y1+y2)/2,(z1+z2)/2);objects.add(line);disposable.push(edges,mat)}}
 const cable=snapshot.cable;const units={m:1,cm:.01,mm:.001,um:1e-6};const scale=units[cable?.unit]/units[snapshot.units?.Length];
 if(cable&&Number.isFinite(scale)){for(const route of cable.routes??[]){const points=route.knots.map(id=>cable.knots.find(k=>k.id===id)).filter(Boolean).map(k=>new THREE.Vector3(...k.position.map(v=>v*scale)));if(points.length>1){const g=new THREE.BufferGeometry().setFromPoints(points),m=new THREE.LineBasicMaterial({color:0xffbb65,depthTest:false});const routeLine=new THREE.Line(g,m);routeLine.renderOrder=10;objects.add(routeLine);disposable.push(g,m)}}}
 const box=new THREE.Box3().setFromObject(objects);if(box.isEmpty())box.setFromCenterAndSize(new THREE.Vector3(),new THREE.Vector3(1,1,1));const center=box.getCenter(new THREE.Vector3()),size=Math.max(...box.getSize(new THREE.Vector3()).toArray(),1);controls.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(1.4,-1.7,1.1).multiplyScalar(size));camera.near=size/10000;camera.far=size*100;camera.updateProjectionMatrix();controls.update();
 const axes=new THREE.AxesHelper(size*.4);axes.position.copy(box.min);scene.add(axes);disposable.push(axes.geometry,axes.material);
 $('geometry-note').textContent=cadLoaded?`CST 导出表面；单位 ${snapshot.units?.Length??'未取得'}。坐标轴为红X、绿Y、蓝Z；表面三角形不是求解网格。`:'当前仅显示实际包围盒与线缆路由，不能据此检查孔缝细节；精确 CAD 导出尚未取得。';
 const resize=()=>{renderer.setSize(host.clientWidth,host.clientHeight);camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix()};const observer=new ResizeObserver(resize);observer.observe(host);resize();let frame;function animate(){frame=requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();cleanup=()=>{cancelAnimationFrame(frame);observer.disconnect();controls.dispose();disposable.forEach(x=>x.dispose());renderer.dispose()};
}
function renderNetwork(s){const host=$('schematic');host.replaceChildren();const names=new Map();for(const b of s.schematic?.blocks??[])names.set(b.name,b.type_short);for(const n of s.schematic?.nets??[])for(const [type,name]of n.ports)if(!names.has(name))names.set(name,type);const entries=[...names];const raw=new Map((s.block_properties??[]).filter(b=>Number.isFinite(b.x)&&Number.isFinite(b.y)).map(b=>[b.name,[b.x,b.y]]));for(const[name]of entries){if(raw.has(name))continue;const neighbors=(s.schematic?.nets??[]).filter(n=>n.ports.some(p=>p[1]===name)).flatMap(n=>n.ports.map(p=>raw.get(p[1])).filter(Boolean));if(neighbors.length)raw.set(name,[neighbors.reduce((n,p)=>n+p[0],0)/neighbors.length,neighbors.reduce((n,p)=>n+p[1],0)/neighbors.length])}let positions;if(raw.size===entries.length&&raw.size>1){const points=[...raw.values()],xs=points.map(p=>p[0]),ys=points.map(p=>p[1]),xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.min(...ys),ymax=Math.max(...ys);positions=new Map([...raw].map(([name,[x,y]])=>[name,[80+(x-xmin)/(xmax-xmin||1)*640,70+(y-ymin)/(ymax-ymin||1)*180]]))}else{positions=new Map(entries.map(([n],i)=>[n,[90+(i%4)*205,70+Math.floor(i/4)*100]]))} for(const net of s.schematic?.nets??[]){const p=net.ports.map(x=>positions.get(x[1])).filter(Boolean);for(let i=1;i<p.length;i++)svg(host,'path',{d:`M${p[0]} L${p[i]}`,stroke:'#7495ba','stroke-width':2,fill:'none'});}for(const[name,type]of entries){const[x,y]=positions.get(name);svg(host,'rect',{x:x-65,y:y-24,width:130,height:48,rx:6,fill:'#243448',stroke:'#6786a9'});svg(host,'text',{x,y:y-3,'text-anchor':'middle'},name);svg(host,'text',{x,y:y+15,'text-anchor':'middle'},type)}}
async function renderCurve(){const host=$('plot');host.replaceChildren();const entry=curves[+$('curves').value];if(!entry){$('curve-meta').textContent='此快照尚未发布结果曲线。';return}const run=generation,curveRun=++curveGeneration;const r=await fetchJSON(entry.url);if(run!==generation||curveRun!==curveGeneration)return;const d=r.data;const form=$('representation').value;const y=d.real.map((v,i)=>form==='real'?v:form==='magnitude'?Math.hypot(v,d.imag[i]):(form==='dbpower'?10:20)*Math.log10(Math.max(Math.hypot(v,d.imag[i]),1e-30)));const finite=y.filter(Number.isFinite);if(!finite.length)throw Error('曲线没有有限值');const xmin=d.x.reduce((a,b)=>Math.min(a,b),Infinity),xmax=d.x.reduce((a,b)=>Math.max(a,b),-Infinity);let ymin=finite.reduce((a,b)=>Math.min(a,b),Infinity),ymax=finite.reduce((a,b)=>Math.max(a,b),-Infinity);if(ymin===ymax)ymax=ymin+1;const xmap=x=>60+(x-xmin)/(xmax-xmin||1)*700,ymap=y=>270-(y-ymin)/(ymax-ymin)*235;svg(host,'path',{d:'M60 25 V270 H760',stroke:'#8194aa',fill:'none'});for(let i=0;i<=4;i++){const x=xmin+(xmax-xmin)*i/4,px=xmap(x);svg(host,'line',{x1:px,x2:px,y1:25,y2:270,stroke:'#334054','stroke-width':.5});svg(host,'text',{x:px,y:292,'text-anchor':'middle'},Number(x.toPrecision(4)).toString())}for(let i=0;i<=4;i++){const y=ymin+(ymax-ymin)*i/4,py=ymap(y);svg(host,'line',{x1:60,x2:760,y1:py,y2:py,stroke:'#334054','stroke-width':.5});svg(host,'text',{x:54,y:py+4,'text-anchor':'end'},Number(y.toPrecision(4)).toString())}svg(host,'text',{x:65,y:16},form==='dbpower'?'Directivity / dBi':form==='db'?'Magnitude / dB':r.ylabel||'Value');const stride=Math.max(1,Math.ceil(y.length/3000));const points=y.map((v,i)=>i%stride===0&&Number.isFinite(v)?`${xmap(d.x[i])},${ymap(v)}`:null).filter(Boolean);svg(host,'polyline',{points:points.join(' '),fill:'none',stroke:'#64c5ca','stroke-width':2});svg(host,'text',{x:300,y:310},r.xlabel??'x 轴单位未取得');$('curve-meta').textContent=`${r.tree_path} · ${r.domain} · CST run ${r.run_id??'未取得'} · ${y.length} 原始点，绘图最多 3000 点。${form==='db'?'幅值 dB 转换。':''} 数值验收状态以运行记录为准。`}
async function load(){const run=++generation;const path=$('snapshots').value;if(!path)return;const s=await fetchJSON(path);if(run!==generation)return;const base=path.slice(0,path.lastIndexOf('/')+1);$('status').textContent=`${s.case_label??'工程'} · 读回 ${new Date(s.read_at*1000).toLocaleString()} · 状态 ${s.status} · ${({reference_operation:'参考工程操作',modified_variant:'参考工程修改变体',rebuilt_from_scratch:'从零重建'})[s.reproduction_kind]??'复现类别未登记'} · 人工验收待确认`;table($('parameters'),['参数','表达式','实际值'],(s.parameters?.parameters??[]).map(p=>[p.name,p.expression,p.value]));$('settings').textContent=JSON.stringify({单位:s.units,频率:s.frequency,求解器:s.solver,网格单元:s.mesh_cells,平面波:s.plane_wave,任务:s.tasks,读回错误:s.errors},null,2);table($('objects'),['对象','材料','实际包围盒'],(s.solids??[]).map(x=>[x.name,x.material,x.bounding_box]));$('network').textContent=JSON.stringify({器件属性:s.block_properties,网络:s.schematic?.nets,线缆:s.cable},null,2);renderNetwork(s);curves=(s.curves??[]).map(c=>({...c,url:base+c.file}));$('curves').replaceChildren(...curves.map((c,i)=>{const o=document.createElement('option');o.value=i;o.textContent=c.label;return o}));await Promise.all([renderModel(s,base,run),renderCurve()])}
async function refresh(){try{const current=$('snapshots').value;const list=await fetchJSON('index.json');$('snapshots').replaceChildren(...list.map(e=>{const o=document.createElement('option');o.value=e.file;o.textContent=e.label;return o}));await load()}catch(e){$('status').textContent=`尚未取得快照或读取失败：${e.message}`}}
async function refreshJobs(){try{const jobs=await fetchJSON('jobs.json');$('jobs').replaceChildren();for(const j of jobs){const row=document.createElement('div');row.className='tools';const text=document.createElement('span');text.textContent=`${j.task} · ${j.state} · 作业 ${j.job_id.slice(0,8)} · 峰值 ${(j.peak_rss_bytes==null?'未取得':(j.peak_rss_bytes/1024**3).toFixed(2))} GiB`;row.append(text);if(!['succeeded','failed','terminated'].includes(j.state)){const stop=document.createElement('button');stop.textContent='停止此仿真';stop.onclick=async()=>{stop.disabled=true;const r=await fetch(j.cancel_path,{method:'POST'});if(!r.ok)throw Error('停止请求未送达');await refreshJobs()};row.append(stop)}$('jobs').append(row)}}catch(e){$('jobs').textContent=`运行状态读取失败：${e.message}`}}
await refreshJobs();setInterval(refreshJobs,2000);
$('refresh').onclick=refresh;$('snapshots').onchange=()=>load().catch(e=>$('status').textContent=e.message);$('curves').onchange=renderCurve;$('representation').onchange=renderCurve;await refresh();
</script></html>
