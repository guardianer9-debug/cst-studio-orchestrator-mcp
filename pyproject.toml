[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cst-studio-orchestrator-mcp"
version = "0.2.0"
description = "Unified MCP automation layer for CST Studio Suite antennas, RF/EM, PCB/SI, schematics, and field-circuit workflows"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    { name = "RFingAdam" },
    { name = "guardianer9-debug" },
]
keywords = [
    "mcp",
    "cst",
    "simulia",
    "orchestration",
    "field-circuit",
    "schematic",
    "rf",
    "simulation",
    "electromagnetic",
    "pcb",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "mcp>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/guardianer9-debug/cst-studio-orchestrator-mcp"
Repository = "https://github.com/guardianer9-debug/cst-studio-orchestrator-mcp"
Issues = "https://github.com/guardianer9-debug/cst-studio-orchestrator-mcp/issues"

[project.optional-dependencies]
live = ["psutil>=5.9"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.scripts]
cst-studio-orchestrator-mcp = "mcp_cst_studio.server:main"
cst-field-circuit-mcp = "mcp_cst_studio.server:main"
mcp-cst-studio = "mcp_cst_studio.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_cst_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100
